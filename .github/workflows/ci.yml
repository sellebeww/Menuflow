name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Tidak ada build: aplikasi berupa JavaScript ES module statis. ESLint dan tsc dijalankan lewat npx dengan versi dipatok.
      - name: Pemeriksaan sintaks
        run: npm run check
      - name: Lint (ESLint)
        run: npm run lint
      - name: Type-check (tsc, JSDoc)
        run: npm run typecheck
      - name: Tes
        run: npm test
      - name: Tes e2e (Chrome bawaan runner)
        run: npm run e2e

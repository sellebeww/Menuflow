name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Tidak ada typecheck atau build: aplikasi berupa JavaScript ES module statis.
      - name: Pemeriksaan sintaks
        run: npm run check
      - name: Tes
        run: npm test
